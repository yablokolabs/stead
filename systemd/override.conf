# Stead Preview — credential enforcement.
#
# Hermes rewrites its own unit file on gateway startup
# (refresh_systemd_unit_if_needed), which reverts any ExecStart edit made
# directly to the unit. A drop-in is not touched by that self-heal, so this is
# what actually guarantees the gateway always launches through the trusted
# launcher: ambient provider credentials scrubbed, only ~/.stead-demo/.env
# loaded, provider and model pinned, fail-closed on a missing or ambiguous key.
[Service]
ExecStart=
ExecStart=/home/azureuser/yablokolabs/stead-preview/scripts/stead-launch.sh
